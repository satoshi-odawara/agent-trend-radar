name: Collect and publish to hub

on:
  workflow_dispatch: {}
  schedule:
    # 毎週月曜 00:00 UTC(Issue.md #10)
    - cron: "0 0 * * 1"

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout agent-trend-radar
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code

      - name: Run collection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: uv run scripts/collect.py

      - name: Determine run date
        run: echo "RUN_DATE=$(date -u +%Y-%m-%d)" >> "$GITHUB_ENV"

      # metrics.jsonのフィールド定義はagent-trend-data/schema/SCHEMA.mdが正。
      # 収集システム側(report.pyのALL_COLUMNS)にフィールドを追加・変更
      # する際はSCHEMA.mdの更新も同一PR・同一協議でセットで行うこと
      # (Issue.md #24、playbook起票issue #1参照)。
      - name: Export hub snapshot
        run: uv run scripts/export_hub_snapshot.py hub_export/metrics.json

      # デフォルトのGITHUB_TOKENは実行元リポジトリ(agent-trend-radar)にしか
      # アクセス権を持たず、別リポジトリ(agent-trend-data)へのpushはできない
      # (GitHub Actionsの既知の制約。agent-trend-data側CLAUDE.mdの記述とも
      # 一致するため、Issue.md #24ではこの制約を前提にPATを直接使用した)。
      - name: Checkout agent-trend-data
        uses: actions/checkout@v4
        with:
          repository: satoshi-odawara/agent-trend-data
          token: ${{ secrets.HUB_REPO_PAT }}
          path: hub

      # SCHEMA.mdとstorage.CHECK_COLUMNSの不一致をハブ更新前に検知する(#26)
      - name: Check hub schema sync
        run: uv run scripts/check_hub_schema_sync.py hub/schema/SCHEMA.md

      # latestは常に最新内容で上書きする。snapshots配下はagent-trend-data
      # CLAUDE.mdの運用ルールにより追記のみ(過去データを上書きしない)。
      # 同日に再実行された場合、既存のsnapshotは上書きせずスキップする
      # (playbook起票issue #2)。
      - name: Update hub snapshot files
        run: |
          set -eu
          cp hub_export/metrics.json "hub/latest/metrics.json"
          if [ -f "hub/snapshots/${RUN_DATE}/metrics.json" ]; then
            echo "::warning::snapshots/${RUN_DATE}/metrics.json は既に存在するため上書きしません(latestのみ更新しました)。"
          else
            mkdir -p "hub/snapshots/${RUN_DATE}"
            cp hub_export/metrics.json "hub/snapshots/${RUN_DATE}/metrics.json"
            uv run scripts/update_hub_manifest.py "hub/manifest.json" "${RUN_DATE}"
          fi

      - name: Commit and push to hub
        working-directory: hub
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add snapshots manifest.json latest
          if git diff --cached --quiet; then
            echo "No changes to push to agent-trend-data."
            exit 0
          fi
          git commit -m "data: ${RUN_DATE} snapshot"
          if ! git push; then
            echo "::error::agent-trend-dataへのpushに失敗しました(コンフリクト等の可能性)。ジョブログを確認してください。"
            exit 1
          fi
